<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fgEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <linearGradient id="fgDarkPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0d111a" />
    </linearGradient>
    <filter id="fgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base Plate -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#fgDarkPlate)" stroke="rgba(0, 230, 118, 0.35)" stroke-width="2.5" />

  <!-- Background Ambient Glow Behind Candlesticks -->
  <circle cx="68" cy="52" r="32" fill="#00E676" opacity="0.14" filter="url(#fgGlow)" />

  <!-- Ascending Candlestick 1 (Left, Small) -->
  <line x1="34" y1="52" x2="34" y2="82" stroke="url(#fgEmeraldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <rect x="29" y="60" width="10" height="16" rx="3" fill="url(#fgEmeraldGrad)" opacity="0.9" />

  <!-- Ascending Candlestick 2 (Middle, Medium) -->
  <line x1="56" y1="36" x2="56" y2="76" stroke="url(#fgEmeraldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <rect x="51" y="44" width="10" height="24" rx="3" fill="url(#fgEmeraldGrad)" />

  <!-- Ascending Candlestick 3 (Right, High Alpha Breakout) -->
  <line x1="78" y1="22" x2="78" y2="68" stroke="#00F5D4" stroke-width="3" stroke-linecap="round" />
  <rect x="73" y="30" width="10" height="30" rx="3" fill="url(#fgEmeraldGrad)" filter="url(#fgGlow)" />

  <!-- Upward Trend Dynamic Arrow Line -->
  <path d="M 24 78 Q 50 68 84 28" fill="none" stroke="#00F5D4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="84,28 72,30 82,40" fill="#00F5D4" />
</svg>
