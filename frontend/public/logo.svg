<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fgLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <linearGradient id="fgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b26" />
      <stop offset="100%" stop-color="#0e131d" />
    </linearGradient>
    <filter id="fgGlowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#fgPlate)" stroke="rgba(0, 230, 118, 0.35)" stroke-width="2" />
    <circle cx="50" cy="40" r="26" fill="#00E676" opacity="0.12" filter="url(#fgGlowSm)" />

    <!-- Candlestick 1 -->
    <line x1="26" y1="42" x2="26" y2="64" stroke="url(#fgLogoGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <rect x="22" y="48" width="8" height="12" rx="2" fill="url(#fgLogoGrad)" opacity="0.85" />

    <!-- Candlestick 2 -->
    <line x1="42" y1="28" x2="42" y2="60" stroke="url(#fgLogoGrad)" stroke-width="2" stroke-linecap="round" />
    <rect x="38" y="34" width="8" height="20" rx="2" fill="url(#fgLogoGrad)" />

    <!-- Candlestick 3 -->
    <line x1="58" y1="18" x2="58" y2="52" stroke="#00F5D4" stroke-width="2.5" stroke-linecap="round" />
    <rect x="54" y="24" width="8" height="24" rx="2" fill="url(#fgLogoGrad)" filter="url(#fgGlowSm)" />

    <!-- Trend Vector Arrow -->
    <path d="M 18 62 Q 38 54 64 22" fill="none" stroke="#00F5D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="64,22 55,24 62,31" fill="#00F5D4" />
  </g>

  <!-- Right Typography Wordmark -->
  <g transform="translate(110, 20)">
    <!-- Brand Title -->
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1.5">
      FOREX <tspan fill="url(#fgLogoGrad)">GROW</tspan>
    </text>

    <!-- Institutional Subtitle -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="9" fill="#00F5D4" letter-spacing="3" text-transform="uppercase" opacity="0.9">
      PRO TRADING PLATFORM
    </text>
  </g>
</svg>
